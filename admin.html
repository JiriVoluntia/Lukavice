<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Lukavice</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .admin-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    
    .auth-section {
      display: none;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    
    .auth-section.active {
      display: block;
    }
    
    .admin-section {
      display: none;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    
    .admin-section.active {
      display: block;
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
    }
    
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
      font-family: inherit;
    }
    
    textarea {
      resize: vertical;
      min-height: 100px;
    }
    
    button {
      background-color: #3B6629;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }
    
    button:hover {
      background-color: #2d5020;
    }
    
    .logout-btn {
      background-color: #d32f2f;
    }
    
    .logout-btn:hover {
      background-color: #b71c1c;
    }
    
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid #ddd;
    }
    
    .tab-btn {
      padding: 10px 20px;
      background: none;
      border: none;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      color: #666;
    }
    
    .tab-btn.active {
      border-bottom-color: #3B6629;
      color: #3B6629;
    }
    
    .message {
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 5px;
      display: none;
    }
    
    .message.success {
      background-color: #d4edda;
      color: #155724;
      display: block;
    }
    
    .message.error {
      background-color: #f8d7da;
      color: #721c24;
      display: block;
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <h1>Admin Panel - Lukavice</h1>
    
    <!-- Přihlášení -->
    <div id="authSection" class="auth-section active">
      <h2>Přihlášení</h2>
      <div id="authMessage" class="message"></div>
      
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="authEmail" placeholder="admin@example.com">
      </div>
      
      <div class="form-group">
        <label>Heslo</label>
        <input type="password" id="authPassword" placeholder="Heslo">
      </div>
      
      <button onclick="login()">Přihlásit se</button>
    </div>
    
    <!-- Admin panel -->
    <div id="adminSection" class="admin-section">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2>Správa dat</h2>
        <button class="logout-btn" onclick="logout()">Odhlásit se</button>
      </div>
      
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('councillors')">Zastupitelé</button>
        <button class="tab-btn" onclick="switchTab('parties')">Strany</button>
        <button class="tab-btn" onclick="switchTab('proposals')">Návrhy</button>
      </div>
      
      <div id="message" class="message"></div>
      
      <!-- Zastupitelé -->
      <div id="councillorsTab" class="admin-section active">
        <h3>Přidat zastupitele</h3>
        
        <div class="form-group">
          <label>Jméno</label>
          <input type="text" id="councillorName" placeholder="Jméno Příjmení">
        </div>
        
        <div class="form-group">
          <label>Strana</label>
          <select id="councillorParty">
            <option value="">Vybrat stranu...</option>
          </select>
        </div>
        
        <div class="form-group">
          <label>Popis</label>
          <textarea id="councillorDescription" placeholder="Popis funkce/oblasti"></textarea>
        </div>
        
        <div class="form-group">
          <label>
            <input type="checkbox" id="councillorActive" checked>
            Aktivní
          </label>
        </div>
        
        <button onclick="addCouncillor()">Přidat zastupitele</button>
      </div>
      
      <!-- Strany -->
      <div id="partiesTab" class="admin-section">
        <h3>Přidat stranu</h3>
        
        <div class="form-group">
          <label>Název</label>
          <input type="text" id="partyName" placeholder="Název strany">
        </div>
        
        <div class="form-group">
          <label>Barva (hex)</label>
          <input type="text" id="partyColor" placeholder="#3B6629">
        </div>
        
        <button onclick="addParty()">Přidat stranu</button>
      </div>
      
      <!-- Návrhy -->
      <div id="proposalsTab" class="admin-section">
        <h3>Přidat návrh</h3>
        
        <div class="form-group">
          <label>Název</label>
          <input type="text" id="proposalName" placeholder="Název návrhu">
        </div>
        
        <div class="form-group">
          <label>Popis</label>
          <textarea id="proposalDescription" placeholder="Popis návrhu"></textarea>
        </div>
        
        <div class="form-group">
          <label>Navrhovatel (ID zastupitele)</label>
          <input type="text" id="proposalProposer" placeholder="councillor-1">
        </div>
        
        <div class="form-group">
          <label>Výsledek</label>
          <select id="proposalResult">
            <option value="SCHVÁLENO">Schváleno</option>
            <option value="ZAMÍTNUTO">Zamítnuto</option>
          </select>
        </div>
        
        <button onclick="addProposal()">Přidat návrh</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCqdn1j6SMhLg0g0Jy0t1zsT_i9PtJIFcM",
      authDomain: "lukavice-288a6.firebaseapp.com",
      projectId: "lukavice-288a6",
      storageBucket: "lukavice-288a6.firebasestorage.app",
      messagingSenderId: "662004004122",
      appId: "1:662004004122:web:7deab3bb97700870bca8a3",
      measurementId: "G-GJYP8YRMQV"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.login = async function() {
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPassword').value;
      
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        showMessage('authMessage', 'Chyba: ' + error.message, 'error');
      }
    };

    window.logout = async function() {
      await signOut(auth);
    };

    window.switchTab = function(tab) {
      document.querySelectorAll('.admin-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(tab + 'Tab').classList.add('active');
      event.target.classList.add('active');
    };

    window.addCouncillor = async function() {
      const name = document.getElementById('councillorName').value;
      const party = document.getElementById('councillorParty').value;
      const description = document.getElementById('councillorDescription').value;
      const active = document.getElementById('councillorActive').checked;
      
      if (!name) {
        showMessage('message', 'Vyplň jméno', 'error');
        return;
      }
      
      try {
        await addDoc(collection(db, 'councillors'), {
          jmeno: name,
          strana: party || null,
          popis: description,
          aktivni: active,
          createdAt: new Date()
        });
        
        showMessage('message', 'Zastupitel přidán', 'success');
        document.getElementById('councillorName').value = '';
        document.getElementById('councillorDescription').value = '';
      } catch (error) {
        showMessage('message', 'Chyba: ' + error.message, 'error');
      }
    };

    window.addParty = async function() {
      const name = document.getElementById('partyName').value;
      const color = document.getElementById('partyColor').value;
      
      if (!name || !color) {
        showMessage('message', 'Vyplň všechna pole', 'error');
        return;
      }
      
      try {
        await addDoc(collection(db, 'parties'), {
          nazev: name,
          barva: color,
          createdAt: new Date()
        });
        
        showMessage('message', 'Strana přidána', 'success');
        document.getElementById('partyName').value = '';
        document.getElementById('partyColor').value = '';
      } catch (error) {
        showMessage('message', 'Chyba: ' + error.message, 'error');
      }
    };

    window.addProposal = async function() {
      const name = document.getElementById('proposalName').value;
      const description = document.getElementById('proposalDescription').value;
      const proposer = document.getElementById('proposalProposer').value;
      const result = document.getElementById('proposalResult').value;
      
      if (!name || !description || !proposer) {
        showMessage('message', 'Vyplň všechna pole', 'error');
        return;
      }
      
      try {
        await addDoc(collection(db, 'proposals'), {
          nazev: name,
          popis: description,
          navrhovatel: proposer,
          vysledek: result,
          pro: [],
          proti: [],
          datum: new Date(),
          createdAt: new Date()
        });
        
        showMessage('message', 'Návrh přidán', 'success');
        document.getElementById('proposalName').value = '';
        document.getElementById('proposalDescription').value = '';
        document.getElementById('proposalProposer').value = '';
      } catch (error) {
        showMessage('message', 'Chyba: ' + error.message, 'error');
      }
    };

    function showMessage(elementId, text, type) {
      const el = document.getElementById(elementId);
      el.textContent = text;
      el.className = 'message ' + type;
      setTimeout(() => {
        el.className = 'message';
      }, 3000);
    }

    // Sledování přihlášení
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('authSection').classList.remove('active');
        document.getElementById('adminSection').classList.add('active');
        loadParties();
      } else {
        document.getElementById('authSection').classList.add('active');
        document.getElementById('adminSection').classList.remove('active');
      }
    });

    async function loadParties() {
      const select = document.getElementById('councillorParty');
      select.innerHTML = '<option value="">Vybrat stranu...</option>';
      
      try {
        const querySnapshot = await getDocs(collection(db, 'parties'));
        querySnapshot.forEach((doc) => {
          const option = document.createElement('option');
          option.value = doc.id;
          option.textContent = doc.data().nazev;
          select.appendChild(option);
        });
      } catch (error) {
        console.error('Chyba:', error);
      }
    }
  </script>
</body>
</html>
