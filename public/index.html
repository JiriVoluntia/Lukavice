<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hlasování - Město Novákov</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav>
    <div class="nav-container">
      <a href="index.html" style="text-decoration: none; color: inherit;">
        <div class="nav-logo">
          <img src="images/logo.png" alt="Logo" class="nav-logo-image">
          <div class="nav-logo-text">
            <div class="nav-logo-title" id="navLogoTitle">Obec Lukavice</div>
            <div class="nav-logo-subtitle" id="navLogoSubtitle">Pardubický kraj</div>
          </div>
        </div>
      </a>
      <div class="nav-buttons">
        <a href="proposals.html" class="nav-button">
          <img src="images/icons/hlasovani.svg" alt="Hlasování" class="nav-icon">
          <span>Hlasování</span>
        </a>
        <a href="councillors.html" class="nav-button">
          <img src="images/icons/zastupitele.svg" alt="Zastupitelé" class="nav-icon">
          <span>Zastupitelé</span>
        </a>
        <a href="#" class="nav-button" onclick="openWeb(event)">
          <img src="images/icons/Web.svg" alt="Web" class="nav-icon">
          <span>Web</span>
        </a>
      </div>
      <button class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
    <div class="nav-mobile" id="navMobile">
      <a href="proposals.html" class="nav-button-mobile">
        <img src="images/icons/hlasovani.svg" alt="Hlasování" class="nav-icon">
        <span>Hlasování</span>
      </a>
      <a href="councillors.html" class="nav-button-mobile">
        <img src="images/icons/zastupitele.svg" alt="Zastupitelé" class="nav-icon">
        <span>Zastupitelé</span>
      </a>
      <a href="#" class="nav-button-mobile" onclick="openWeb(event)">
        <img src="images/icons/Web.svg" alt="Web" class="nav-icon">
        <span>Web</span>
      </a>
    </div>
  </nav>

  <main style="margin-top: 90px;">
    <div class="composition-section" id="compositionSection">
      <!-- Složení zastupitelstva se načte zde -->
    </div>
    
    <h2 style="margin-top: 40px; margin-left: 20px;">Poslední hlasování</h2>
    <div class="proposals-container" id="proposalsContainer">
      <!-- Poslední 3 hlasování se načtou zde -->
    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/councillors.js"></script>
  <script src="js/proposals.js"></script>
  <script>
    // Přepis init funkce pro hlavní stránku
    async function initHomepage() {
      const councillors = await loadCouncillors();
      const parties = await loadParties();
      const functions = await loadFunctions();
      
      // Vytvoření mapy funkcí
      const functionMap = {};
      functions.forEach(func => {
        functionMap[func.zastupitel] = func.nazev;
      });
      
      // Počítání zastupitelů podle stran
      const partyCounts = {};
      Object.values(councillors).forEach(councillor => {
        if (councillor.aktivni) {
          const partyId = councillor.strana || 'independent';
          partyCounts[partyId] = (partyCounts[partyId] || 0) + 1;
        }
      });
      
      // Vytvoření složení zastupitelstva
      const compositionItems = Object.entries(parties)
        .filter(([partyId]) => (partyCounts[partyId] || 0) > 0)
        .map(([partyId, party]) => {
          const count = partyCounts[partyId];
          return `
            <div class="composition-item">
              <div style="display: flex; align-items: center; gap: 5px;">
                <span class="composition-label">${party.nazev}</span>
                <span class="composition-count" style="color: ${party.barva}">${count}</span>
              </div>
            </div>
          `;
        })
        .join('');
      
      // Vytvoření všech koleček
      const allCircles = [];
      Object.entries(parties).forEach(([partyId, party]) => {
        const count = partyCounts[partyId] || 0;
        if (count > 0) {
          for (let i = 0; i < count; i++) {
            allCircles.push(`<div class="composition-circle" style="background-color: ${party.barva}"></div>`);
          }
        }
      });
      
      // Výpočet počtu řádků
      const totalCouncillors = allCircles.length;
      let rows = 2;
      if (totalCouncillors > 10) rows = 3;
      if (totalCouncillors > 25) rows = 4;
      if (totalCouncillors > 40) rows = 5;
      
      const visualizationDiv = document.createElement('div');
      visualizationDiv.className = 'composition-visualization';
      visualizationDiv.style.gridTemplateRows = `repeat(${rows}, 40px)`;
      visualizationDiv.innerHTML = allCircles.join('');
      
      document.getElementById('compositionSection').innerHTML = `
        <div class="composition-header">
          ${compositionItems}
        </div>
      `;
      document.getElementById('compositionSection').appendChild(visualizationDiv);
      
      // Načtení a zobrazení posledních 3 hlasování
      const allCouncillors = {};
      Object.values(councillors).forEach(c => {
        allCouncillors[c.id] = c.jmeno;
      });
      
      const proposals = [];
      try {
        const fileList = await fetch('/api/list?dir=data/navrhy').then(r => r.json());
        for (const fileName of fileList) {
          try {
            const res = await fetch(`data/navrhy/${fileName}.json`);
            const data = await res.json();
            proposals.push(data);
          } catch (e) {
            // Pokračuj dál
          }
        }
      } catch (error) {
        console.error('Chyba při načítání návrhů:', error);
      }
      
      // Seřazení a zobrazení posledních 3
      proposals.sort((a, b) => new Date(b.datum) - new Date(a.datum));
      const container = document.getElementById('proposalsContainer');
      proposals.slice(0, 3).forEach(proposal => {
        container.innerHTML += createProposalHTML(proposal, allCouncillors);
      });
    }
    
    document.addEventListener('DOMContentLoaded', initHomepage);
  </script>
</body>
</html>
